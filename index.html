<!doctype html>
<!-- Dsivio 桌面应用入口 HTML 文件 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dsivio</title>
    <script>
      (function () {
        var ua = navigator.userAgent
        if (/Windows/i.test(ua)) document.documentElement.classList.add('windows')
        else if (/Mac|iPhone|iPad|iPod/i.test(ua)) document.documentElement.classList.add('macos')
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      /* 冷启动闪屏：03 真实点阵化。页面跟主题；点阵用实色黑/白，亮度地板抬高，
         否则原稿 .07–.09 在全屏里几乎看不见 Logo。节奏/缩放仍是原稿 dotwave。 */
      #kv-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #0e1013;
        --speed: 1;
      }
      html.dark #kv-boot-splash {
        background: #090a0d;
        color: #f6f7f9;
      }
      #kv-boot-splash.is-leaving {
        opacity: 0;
        transition: opacity 280ms ease;
        pointer-events: none;
      }
      #kv-boot-splash .dot-svg { width: 178px; height: 178px; overflow: visible; }
      #kv-boot-splash .dm-dot {
        fill: currentColor;
        opacity: .42;
        transform-box: fill-box;
        transform-origin: center;
        animation: dotwave calc(1.8s/var(--speed)) ease-in-out infinite;
        animation-delay: calc(var(--d)/var(--speed));
      }
      @keyframes dotwave {
        0%, 100% { opacity: .38; transform: scale(.55); }
        35% { opacity: 1; transform: scale(1.45); }
        65% { opacity: .55; transform: scale(.8); }
      }
      @media (prefers-reduced-motion: reduce) {
        #kv-boot-splash .dm-dot { animation: none; opacity: .85; transform: none; }
      }
    </style>
  </head>
