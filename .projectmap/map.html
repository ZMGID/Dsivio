  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; padding: 20px 24px 12px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
.meta { color: var(--ink-3); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 0 24px 16px; }
.stat b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
.stat span { color: var(--ink-2); font-size: 13px; }
.stat.bad b { color: var(--bad); } .stat.new b { color: var(--new); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 0 24px 24px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 18px; vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
.legend i.sq { width: 12px; height: 12px; border: 1px solid; border-radius: 3px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
aside h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
aside h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 16px 0 6px; }
aside ul { list-style: none; margin: 0; padding: 0; }
aside li { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
aside li:last-child { border-bottom: 0; }
.muted { color: var(--ink-3); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 6px; line-height: 18px; }
.tag.bad { background: var(--bad-bg); color: var(--bad); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.new { background: var(--new-bg); color: var(--new); }
button.link { all: unset; cursor: pointer; color: var(--sel); border-radius: 3px; }
button.link:focus-visible, .node:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
button.back { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--ink-2); border-radius: var(--r); padding: 2px 10px; cursor: pointer; margin-bottom: 10px; }
button.back:hover { border-color: var(--ink-3); }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.lane-label { font-size: 12px; fill: var(--ink-2); font-weight: 600; }
.band { fill: var(--band-a); } .band.alt { fill: var(--band-b); }
.node { cursor: pointer; outline: none; }
.node rect.box { fill: var(--node); stroke: var(--node-line); stroke-width: 1; }
.node.new rect.box { fill: var(--new-bg); stroke: var(--new); }
.node.orphan rect.box { fill: var(--warn-bg); stroke: var(--warn); }
.node.ext rect.box { stroke-dasharray: 4 3; }
.node.sel rect.box { stroke: var(--sel); stroke-width: 2; }
.node text.name { font-size: 13px; font-weight: 600; fill: var(--ink); }
.node text.sub { font-size: 11px; fill: var(--ink-3); }
.node .badge { fill: var(--bad); } .node .badge-t { fill: #fff; font-size: 10px; font-weight: 700; }
.edge { fill: none; stroke: var(--edge); }
.edge.new { stroke: var(--new); } .edge.bad { stroke: var(--bad); }
.edge.lateral { display: none; } .edge.lateral.show { display: inline; }
.dim { opacity: .14; }
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity .15s ease-out; } }
</style>

  if (!pos[e.from] || !pos[e.to]) continue
  const down = L(e.to) > L(e.from) || (lateral(e) && pos[e.to].y > pos[e.from].y)
  const up = L(e.to) < L(e.from) || (lateral(e) && pos[e.to].y < pos[e.from].y)
  e._sa = down ? 'b' : 't'; e._sb = down ? 't' : up ? 'b' : 't'
  port(e.from, e._sa, e); port(e.to, e._sb, e)
}
function px(id, side, e) {
  const list = ports[id + side] || [e]
  list.sort((a, b) => {
    const oa = a.from === id ? a.to : a.from, ob = b.from === id ? b.to : b.from
    return pos[oa].x - pos[ob].x || pos[oa].y - pos[ob].y
  })
  const i = list.indexOf(e), n = list.length
  return pos[id].x + NW / 2 + (n > 1 ? (i / (n - 1) - 0.5) * NW * 0.7 : 0)
}
for (const e of [...S.edges].sort((a, b) => rank(a) - rank(b))) {
  const a = pos[e.from], b = pos[e.to]
  if (!a || !b) continue
  const x1 = px(e.from, e._sa, e), x2 = px(e.to, e._sb, e)
  const y1 = e._sa === 'b' ? a.y + NH : a.y, y2 = e._sb === 't' ? b.y - 3 : b.y + NH + 3
  let d
  if (e._sa === 'b' || e._sb === 'b') {
    const dy = Math.max(22, Math.abs(y2 - y1) / 2), s1 = e._sa === 'b' ? 1 : -1, s2 = e._sb === 't' ? -1 : 1
    d = `M${x1} ${y1} C${x1} ${y1 + s1 * dy} ${x2} ${y2 + s2 * dy} ${x2} ${y2}`
  } else {
    const top = Math.min(y1, y2) - 12 - Math.min(16, Math.abs(x2 - x1) / 14)
    d = `M${x1} ${y1} C${x1} ${top} ${x2} ${top} ${x2} ${y2}`
  }
  const k = kindOf(e)
  const el = s('path', { d, class: 'edge ' + (k === 'edge' ? '' : k) + (lateral(e) && k === 'edge' ? ' lateral' : ''),
    'stroke-width': (1 + Math.min(1.6, Math.log2(e.weight) * 0.35)).toFixed(2), 'marker-end': `url(#arr-${k})` })
  el.append(s('title', {}, `${nameOf(e.from)} → ${nameOf(e.to)}（${e.weight} 处）`))
  el.dataset.from = e.from; el.dataset.to = e.to
  gEdges.append(el); edgeEls.push(el)
}

// ---------- 节点 ----------
const nodeEls = {}
const clip = (t, n) => [...t].length > n ? [...t].slice(0, n - 1).join('') + '…' : t
for (const c of caps) {
  const p = pos[c.id]; if (!p) continue
  const iss = issuesByCap[c.id] || []
  const cls = ['node', newCaps.has(c.id) && 'new', iss.some(i => i.type === 'orphan') && 'orphan', c.external && 'ext'].filter(Boolean).join(' ')
  const g = s('g', { class: cls, tabindex: 0, role: 'button', 'aria-label': c.name })
  g.append(s('rect', { class: 'box', x: p.x, y: p.y, width: NW, height: NH, rx: 6 }))
  g.append(s('text', { class: 'name', x: p.x + 12, y: p.y + 19 }, clip(c.name, 10)))
  const n = (S.caps[c.id] || { files: [] }).files.length
  g.append(s('text', { class: 'sub', x: p.x + 12, y: p.y + 36 }, c.external ? '外部服务' : n + ' 个文件'))
  const hard = iss.filter(i => i.type !== 'orphan').length
  if (hard) {
    g.append(s('circle', { class: 'badge', cx: p.x + NW - 4, cy: p.y + 4, r: 8 }))
    g.append(s('text', { class: 'badge-t', x: p.x + NW - 4, y: p.y + 7.5, 'text-anchor': 'middle' }, hard > 9 ? '9+' : hard))
  }
  g.append(s('title', {}, c.name + (c.desc ? '：' + c.desc : '')))
  g.addEventListener('click', ev => { ev.stopPropagation(); select(sel === c.id ? null : c.id) })
  g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(sel === c.id ? null : c.id) } })
  gNodes.append(g); nodeEls[c.id] = g
}

// ---------- 选中与链路 ----------
let sel = null
function downstream(id) {
  const on = new Set([id]), q = [id]
  while (q.length) { const x = q.shift(); for (const e of S.edges) if (e.from === x && L(e.to) > L(e.from) && !on.has(e.to)) { on.add(e.to); q.push(e.to) } }
  return on
}
function select(id) {
  sel = id
  const down = id ? downstream(id) : null
  const lit = id ? new Set(down) : null
  if (id) for (const e of S.edges) { if (e.to === id) lit.add(e.from); if (e.from === id) lit.add(e.to) }
  for (const [cid, el] of Object.entries(nodeEls)) { el.classList.toggle('dim', !!lit && !lit.has(cid)); el.classList.toggle('sel', cid === id) }
  for (const el of edgeEls) {
    const f = el.dataset.from, t = el.dataset.to, touches = f === id || t === id
    const onPath = touches || (!!down && down.has(f) && down.has(t) && L(t) > L(f))
    el.classList.toggle('show', !!id && touches)
    el.classList.toggle('dim', !!id && !onPath)
  }
  id ? showCap(id) : showOverview()
}
svg.addEventListener('click', () => sel && select(null))
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sel) { const prev = sel; select(null); nodeEls[prev] && nodeEls[prev].focus() } })

const TYPE = { broken: ['断链', 'bad'], reverse: ['逆向依赖', 'bad'], orphan: ['没人调用', 'warn'], empty: ['空能力', 'warn'] }
function issueItem(i, withCap) {
  const [label, tone] = TYPE[i.type] || [i.type, 'warn']
  return h('li', {}, h('span', { class: 'tag ' + tone }, label),
    withCap && i.cap ? h('button', { class: 'link', type: 'button', onclick: () => select(i.cap) }, nameOf(i.cap)) : null,
    withCap && i.cap ? '：' : '', i.msg, i.file ? h('div', { class: 'muted' }, i.file) : null)
}
const panel = $('panel')
function showOverview() {
  panel.replaceChildren()
  panel.append(h('h2', {}, '概览'), h('div', { class: 'muted' }, '点击图上的能力查看它的调用链路，Esc 取消'))
  panel.append(h('h3', {}, '本次变化'))
  const list = h('ul')
  if (ch.first) list.append(h('li', {}, '首次生成线路图'))
  for (const c of ch.newCaps || []) list.append(h('li', {}, h('span', { class: 'tag new' }, '新能力'), h('button', { class: 'link', type: 'button', onclick: () => select(c) }, nameOf(c))))
  for (const k of ch.newEdges || []) { const [a, b] = k.split('>'); list.append(h('li', {}, h('span', { class: 'tag new' }, '新连线'), nameOf(a) + ' → ' + nameOf(b))) }
  for (const c of ch.removedCaps || []) list.append(h('li', {}, h('span', { class: 'tag warn' }, '移除'), nameOf(c)))
  for (const i of ch.fixedIssues || []) list.append(h('li', {}, h('span', { class: 'tag new' }, '已修复'), i.msg))
  if (!list.children.length) list.append(h('li', { class: 'muted' }, '没有结构变化'))
  panel.append(list)
  panel.append(h('h3', {}, `问题（${S.issues.length}）`))
  const il = h('ul')
  const order = ['broken', 'reverse', 'orphan', 'empty']
  for (const i of [...S.issues].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type))) il.append(issueItem(i, true))
  if (!S.issues.length) il.append(h('li', { class: 'muted' }, '没有发现问题'))
  panel.append(il)
  if (S.unassigned.length) {
    const d = h('details', {}, h('summary', {}, `未归类文件（${S.unassigned.length}）`))
    const ul = h('ul'); S.unassigned.slice(0, 200).forEach(u => ul.append(h('li', {}, u.path, u.suggest ? h('div', { class: 'muted' }, '建议归入：' + nameOf(u.suggest)) : null)))
    d.append(ul); panel.append(h('h3', {}, '待整理'), d)
  }
}
function showCap(id) {
  const c = byId[id], files = (S.caps[id] || { files: [] }).files
  panel.replaceChildren()
  panel.append(h('button', { class: 'back', type: 'button', onclick: () => select(null) }, '返回概览'))
  panel.append(h('h2', {}, c.name), h('div', { class: 'muted' }, D.layers[layerIdx[c.layer]].name + '层', c.external ? '，外部服务' : `，${files.length} 个文件`))
  if (c.desc) panel.append(h('p', { style: 'margin:8px 0 0' }, c.desc))
  const iss = issuesByCap[id] || []
  if (iss.length) { const ul = h('ul'); iss.forEach(i => ul.append(issueItem(i, false))); panel.append(h('h3', {}, '问题'), ul) }
  const rel = (list, other, title) => {
    const ul = h('ul')
    for (const e of list.sort((a, b) => b.weight - a.weight)) ul.append(h('li', {},
      h('button', { class: 'link', type: 'button', onclick: () => select(e[other]) }, nameOf(e[other])),
      h('span', { class: 'muted' }, `  ${e.weight} 处，${e.kinds.map(k => ({ import: '引用', external: '外部', http: '接口', tauri: 'Tauri 命令', ipc: 'IPC', event: '事件' }[k] || k)).join('、')}`),
      h('details', {}, h('summary', {}, '示例'), h('div', { class: 'muted' }, ...e.samples.map(x => h('div', {}, x))))))
    if (!list.length) ul.append(h('li', { class: 'muted' }, '无'))
    panel.append(h('h3', {}, title), ul)
  }
  rel(S.edges.filter(e => e.from === id), 'to', '它调用')
  rel(S.edges.filter(e => e.to === id), 'from', '调用它的')
  if (c.externals.length) panel.append(h('h3', {}, '对应的外部依赖'), h('div', { class: 'muted' }, c.externals.join('，')))
  if (files.length) {
    const d = h('details', {}, h('summary', {}, `文件（${files.length}）`))
    const ul = h('ul'); files.slice(0, 300).forEach(f => ul.append(h('li', {}, f))); d.append(ul)
    panel.append(h('h3', {}, '包含'), d)
  }
}
showOverview()
</script>
</body>
</html>
