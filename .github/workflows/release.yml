name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      ref:
        description: 'Git ref to build from (branch/tag/commit)'
        required: true
        default: 'main'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

jobs:
  create-release:
    # Both platform jobs upload into this release. Creating it first avoids a
    # race where two tauri-action steps try to open the same tag.
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          extra=()
          case "$RELEASE_TAG" in
            *beta*|*alpha*|*rc*) extra+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsivio $RELEASE_TAG" \
            --notes "Automated Windows x64 NSIS installer build for ${RELEASE_TAG}. Built from: ${BUILD_REF}." \
            --verify-tag \
            "${extra[@]}"

  tauri-release:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup build-time Python packager
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.7'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows sidecar stub
        run: npm run build:swift

      - name: Prepare and verify bundled MCP runtimes
        run: npm run build:video-runtime

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: dsivio ${{ env.RELEASE_TAG }}
          releaseBody: |
            Automated Windows x64 build for ${{ env.RELEASE_TAG }}.
            Built from: ${{ env.BUILD_REF }}
            - Windows: NSIS installer (.exe)
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') }}
          includeUpdaterJson: false
          tauriScript: npx tauri
          args: --bundles nsis

      - name: Verify bundled skills in Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $inspectDir = Join-Path $env:RUNNER_TEMP ('kivio-installer-check-' + [guid]::NewGuid().ToString('n'))
          & 'C:/Program Files/7-Zip/7z.exe' x $installer.FullName "-o$inspectDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract NSIS installer' }
          $files = Get-ChildItem -LiteralPath $inspectDir -Recurse -File
          $runtimeRecord = $files | Where-Object { $_.FullName -match '[\\/]video-runtime[\\/]runtime\.json$' } | Select-Object -First 1
          if (-not $runtimeRecord) { throw 'Bundled video runtime missing from installer' }
          node scripts/verify-video-runtime.mjs $runtimeRecord.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Installed video runtime verification failed' }
          foreach ($skill in @('pdf','docx','xlsx','obsidian-markdown','obsidian-bases','json-canvas','obsidian-cli')) {
            $match = $files | Where-Object { $_.FullName -match "[\\/]skills[\\/]$skill[\\/]SKILL\.md$" -and $_.Length -gt 0 }
            if (-not $match) { throw "Missing bundled skill: $skill" }
            Write-Host "Verified: skills/$skill/SKILL.md"
          }
