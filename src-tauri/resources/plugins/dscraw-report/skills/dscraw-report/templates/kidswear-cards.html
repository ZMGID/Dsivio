<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__DOCUMENT_TITLE__</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1136px;min-height:645px}body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#142033;background:#f6f7f6}.report{width:1136px;min-height:645px}.top{min-height:66px;display:flex;align-items:center;padding:10px 34px;gap:14px;color:#fff;background:#17365d;border-bottom:4px solid #2f7fbd}.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:9px;background:#347fbd;border:1px solid rgba(255,255,255,.22)}.mark i{display:block;width:5px;border-radius:3px;background:#d9eeff}.mark i:nth-child(1){height:14px}.mark i:nth-child(2){height:24px}.mark i:nth-child(3){height:19px}.top h1{min-width:0;margin:0;font-size:25px;line-height:1.25;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(145px,auto);column-gap:48px;row-gap:16px;padding:22px 44px 20px}.store{min-width:0;padding:0 14px 10px;background:#fff;border:1px solid #cfd6da}.store-head{min-height:48px;display:grid;grid-template-columns:34px minmax(116px,1fr) minmax(0,1.25fr) auto;gap:9px;align-items:center;border-bottom:1px solid #cfd6da}.shop-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#29577e;background:transparent;border:1px solid #adc2d1;font-size:13px}.store-name{font-size:17px;line-height:20px;font-weight:800;overflow-wrap:anywhere}.ads{font-size:15px;line-height:19px;font-weight:800;text-align:center;overflow-wrap:anywhere}.status{justify-self:end;min-width:58px;padding:5px 8px;border-radius:3px;color:#fff;background:#247a58;text-align:center;font-size:11px;font-weight:800;white-space:nowrap}.status.partial{background:#bd7b18}.status.missing{background:#b94a42}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:0}.metric{min-width:0;min-height:78px;padding:13px 5px}.metric+.metric{padding-left:20px;border-left:1px solid #dfe4e6}.metric small{display:block;color:#6e7d86;font-size:11px;font-weight:700}.metric b{display:block;margin-top:4px;color:#17283a;font-size:26px;line-height:1.1;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.reason{font-size:11px;line-height:16px;color:#8c433b;overflow-wrap:anywhere}.no-ad .ads{visibility:hidden}
</style>
</head>
<body><main class="report"><header class="top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><h1 id="report-title"></h1></header><section class="grid" id="store-grid" aria-label="店铺日报"></section></main>
<script>
const report=__REPORT_JSON__;
/* [Sources]
__SOURCES__
*/
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const dateText=report.dateIso.split('-').map((part,index)=>index?String(Number(part)):part).join('.');
const partial=report.capturedCount<report.expectedCount?'已获取':'';
const sales=Object.entries(report.salesTotals).map(([currency,value])=>`${partial}${Object.keys(report.salesTotals).length===1?'销售额':`销售额${currency}`}：${value}`);
const quantities=Object.entries(report.quantityTotals).map(([metric,item])=>`${partial}${metric==='unitsSold'?'SHEIN销量':item.label}：${item.value}`);
document.getElementById('report-title').textContent=`${report.title}${dateText}日报（${[...sales,...quantities].join('；')}）`;
document.getElementById('store-grid').innerHTML=report.stores.map(store=>{
  const state=store.status==='未获取'?'missing':store.status==='部分获取'?'partial':'';
  const stateText=store.status==='成功'?'运营中':store.status;
  const reason=[store.missingReason,store.adMissingReason].filter(Boolean).join('；');
  const ads=store.collectAds?(store.adCost==null?'广告未获取':`广告费 ${escapeHtml(store.adCost)}　ROI ${store.roi==null?'未获取':escapeHtml(store.roi)}`):'';
  return `<article class="store store-row ${store.collectAds?'':'no-ad'}"><div class="store-head"><span class="shop-dot" aria-hidden="true">▰</span><span class="store-name">${escapeHtml(store.name)}</span><span class="ads">${ads}</span><span class="status ${state}">${stateText}</span></div><div class="metrics"><div class="metric"><small>营业额</small><b>${store.sales==null?'未获取':escapeHtml(store.sales)}</b></div><div class="metric"><small>${escapeHtml(store.orderLabel)}</small><b>${store.orders==null?'未获取':escapeHtml(store.orders)}</b></div></div>${reason?`<div class="reason">${escapeHtml(reason)}</div>`:''}</article>`;
}).join('');
</script>
</body></html>
